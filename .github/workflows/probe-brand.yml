name: Probe brand search API
on:
  push:
    branches: ["claude/**"]
    paths: ["probe_brand.py", ".github/workflows/probe-brand.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - env:
          PYTHONUTF8: "1"
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
          NAVER_CUSTOMER_IDS: ${{ secrets.NAVER_CUSTOMER_IDS }}
        run: python probe_brand.py
