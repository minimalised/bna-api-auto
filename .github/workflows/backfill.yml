name: Backfill (reset + refill)

# 수동 전용. 리포트 탭을 (선택 시) 백업 후 비우고, 지정 기간 RAW를 매체별로 다시 채운 뒤 통합 탭을 갱신.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 (YYYY-MM-DD)"
        required: true
        default: "2026-09-01"
      until:
        description: "종료일 (YYYY-MM-DD, 어제까지)"
        required: true
        default: "2026-10-14"
      reset:
        description: "채우기 전에 리포트 탭(RAW·통합) 내용을 모두 지움 (백업 CSV 남김)"
        type: boolean
        default: false
      confirm:
        description: "reset을 켰다면 '삭제' 입력"
        required: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  SINCE: ${{ inputs.since }}
  UNTIL: ${{ inputs.until }}

jobs:
  reset:
    if: inputs.reset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "삭제" ]; then
            echo "::error::reset을 켰으면 confirm 칸에 '삭제'를 입력해야 합니다."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "gspread>=6.0"
      - name: Back up and clear report tabs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python reset_sheet.py --confirm
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reset-backup-${{ github.run_number }}
          path: reports/
          retention-days: 90
          if-no-files-found: ignore

  meta:
    needs: reset
    if: ${{ !cancelled() && needs.reset.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_IDS: ${{ secrets.META_ACCOUNT_IDS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python meta_report.py --since "$SINCE" --until "$UNTIL"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backfill-meta-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  google:
    needs: reset
    if: ${{ !cancelled() && needs.reset.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sheet-write-google
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_IDS: ${{ secrets.GOOGLE_ADS_CUSTOMER_IDS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python google_report.py --since "$SINCE" --until "$UNTIL"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backfill-google-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  naver:
    needs: reset
    if: ${{ !cancelled() && needs.reset.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: sheet-write-naver
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - env:
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
          NAVER_CUSTOMER_IDS: ${{ secrets.NAVER_CUSTOMER_IDS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          NAVER_RAW_PREFIX: naver_raw
          NAVER_REPORT_TIMEOUT: "600"
        # 성별·연령은 네이버 제약상 최근 7일만 수집됨
        run: python naver_report.py --since "$SINCE" --until "$UNTIL"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backfill-naver-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  integrated:
    needs: [meta, google, naver]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sheet-write-integrated
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "gspread>=6.0"
      - env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python integrated_report.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backfill-integrated-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
