name: Naver SearchAd Daily Report

on:
  schedule:
    - cron: "20 23 * * *"   # 매일 08:20 KST
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 (YYYY-MM-DD, 비우면 최근 14일)"
        required: false
      until:
        description: "종료일 (YYYY-MM-DD, 비우면 시작일과 동일)"
        required: false
      list_accounts:
        description: "접근 가능한 광고주 계정 목록만 출력"
        type: boolean
        default: false

concurrency:
  group: sheet-write-naver

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Naver SearchAd report
        env:
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
          NAVER_CUSTOMER_IDS: ${{ secrets.NAVER_CUSTOMER_IDS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IN_SINCE: ${{ inputs.since }}
          IN_UNTIL: ${{ inputs.until }}
          IN_LIST: ${{ inputs.list_accounts }}
        run: |
          ARGS=()
          [ -n "$IN_SINCE" ] && ARGS+=(--since "$IN_SINCE")
          [ -n "$IN_UNTIL" ] && ARGS+=(--until "$IN_UNTIL")
          [ "$IN_LIST" = "true" ] && ARGS+=(--list-accounts)
          python naver_report.py "${ARGS[@]}"

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: naver-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
