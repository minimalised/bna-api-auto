name: Google Ads Daily Report

on:
  schedule:
    - cron: "10 23 * * *"   # 매일 08:10 KST (메타보다 10분 뒤)
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 (YYYY-MM-DD, 비우면 최근 30일)"
        required: false
      until:
        description: "종료일 (YYYY-MM-DD, 비우면 시작일과 동일)"
        required: false
      list_accounts:
        description: "MCC 하위 계정 ID 목록만 출력"
        type: boolean
        default: false

concurrency:
  group: sheet-write-google   # 같은 탭 동시 쓰기 방지

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Google Ads report
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_IDS: ${{ secrets.GOOGLE_ADS_CUSTOMER_IDS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IN_SINCE: ${{ inputs.since }}
          IN_UNTIL: ${{ inputs.until }}
          IN_LIST: ${{ inputs.list_accounts }}
        run: |
          ARGS=()
          [ -n "$IN_SINCE" ] && ARGS+=(--since "$IN_SINCE")
          [ -n "$IN_UNTIL" ] && ARGS+=(--until "$IN_UNTIL")
          [ "$IN_LIST" = "true" ] && ARGS+=(--list-accounts)
          python google_report.py "${ARGS[@]}"

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: google-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
