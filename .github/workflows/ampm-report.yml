name: AMPM Naver Report Daily

on:
  schedule:
    - cron: "20 22 * * *"   # 매일 07:20 KST: 어제까지 8일 다시 가져와 AMPM 리포트 시트 갱신
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 (YYYY-MM-DD, 비우면 어제 기준 8일)"
        type: string
        required: false
      until:
        description: "종료일 (YYYY-MM-DD, 비우면 어제)"
        type: string
        required: false
      dry_run:
        description: "테스트: 조회만 하고 시트는 바꾸지 않음"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sheet-write-ampm
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "gspread>=6.0"

      # 공개 저장소: 로그에는 행 수만 남기고, 데이터 파일은 업로드하지 않는다.
      - name: Update AMPM report sheet
        env:
          AMPM_NAVER_API_KEY: ${{ secrets.AMPM_NAVER_API_KEY }}
          AMPM_NAVER_SECRET_KEY: ${{ secrets.AMPM_NAVER_SECRET_KEY }}
          AMPM_NAVER_CUSTOMER_ID: ${{ secrets.AMPM_NAVER_CUSTOMER_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          AMPM_SHEET_ID: ${{ secrets.AMPM_SHEET_ID }}
          IN_SINCE: ${{ inputs.since }}
          IN_UNTIL: ${{ inputs.until }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "${IN_SINCE:-}" ]]; then ARGS+=(--since "$IN_SINCE"); fi
          if [[ -n "${IN_UNTIL:-}" ]]; then ARGS+=(--until "$IN_UNTIL"); fi
          if [[ "${IN_DRY_RUN:-false}" == "true" ]]; then ARGS+=(--dry-run); fi
          python ampm_report.py "${ARGS[@]}"
